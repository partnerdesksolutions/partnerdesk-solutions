<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Order | PartnerDesk Solutions</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f8fc;
  color:#172033;
}

.header{
  background:#102a56;
  color:#fff;
  padding:18px 5%;
  font-size:21px;
  font-weight:800;
}

.header span{
  color:#10a6a6;
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  padding:28px;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

h1{
  color:#102a56;
  margin-bottom:7px;
}

.subtitle{
  color:#667085;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.full{
  grid-column:1 / -1;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5dce5;
  border-radius:8px;
  font:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:13px 20px;
  background:#102a56;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.submit{
  margin-top:22px;
  background:#087f5b;
  width:100%;
}

.success{
  display:none;
  margin-top:20px;
  padding:18px;
  background:#ecfdf3;
  color:#067647;
  border-radius:10px;
}

.error{
  color:#b42318;
  margin-top:15px;
}

.order-id{
  font-size:22px;
  font-weight:800;
}

.back{
  display:inline-block;
  margin-top:18px;
  color:#102a56;
  font-weight:700;
  text-decoration:none;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}

</style>

</head>

<body>

<div class="header">
  PartnerDesk <span>Solutions</span> — New Order
</div>


<div class="container">

<div class="card">

<h1>Submit New Order</h1>

<p class="subtitle">
Create a new customer service order.
</p>


<form id="orderForm">

<div class="grid">


<div>
<label>Customer Name *</label>

<input
  id="customerName"
  required
  placeholder="Customer full name"
>

</div>


<div>
<label>Customer Mobile *</label>

<input
  id="customerMobile"
  required
  maxlength="10"
  placeholder="10 digit mobile"
>

</div>


<div class="full">

<label>Customer Address</label>

<textarea
  id="customerAddress"
  placeholder="Customer address"
></textarea>

</div>


<div>

<label>Service Category *</label>

<select id="serviceCategory" required>

  <option value="">Loading categories...</option>

</select>

</div>


<div>

<label>Service *</label>

<select id="serviceName" required disabled>

  <option value="">Select Service</option>

</select>

</div>


<div>

<label>Government Fee (₹)</label>

<input
  id="governmentFee"
  type="number"
  min="0"
  step="0.01"
  value="0"
>

</div>


<div>

<label>Processing Fee (₹)</label>

<input
  id="processingFee"
  type="number"
  min="0"
  step="0.01"
  value="0"
>

</div>


<div>

<label>Payment Status *</label>

<select id="paymentStatus" required>

<option value="DUE">DUE</option>
<option value="PARTIAL">PARTIAL</option>
<option value="PAID">PAID</option>

</select>

</div>


<div class="full">

<label>Document / Requirement Notes</label>

<textarea
  id="documentNotes"
  placeholder="Required documents or missing documents"
></textarea>

</div>


<div class="full">

<label>Additional Notes</label>

<textarea
  id="notes"
  placeholder="Additional order information"
></textarea>

</div>


</div>


<button
  type="submit"
  class="submit"
>
  SUBMIT ORDER
</button>


<div id="error" class="error"></div>


</form>


<div id="success" class="success">

  <div>Order submitted successfully.</div>

  <br>

  <div>
    Order ID:
    <span
      id="generatedOrderId"
      class="order-id"
    ></span>
  </div>

  <br>

  <a
    href="partner-dashboard.html"
    class="back"
  >
    ← Back to Dashboard
  </a>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://mraofbhjvvuqncexzpfn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_8U_YBekhylWgzRMbfiPd-A_niuXsWaP";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let partnerProfile = null;


async function loadPartner(){

  const {
    data:{
      user
    }
  } =
    await db.auth.getUser();


  if(!user){

    window.location.href =
      "partner-login.html";

    return;

  }


  const {
    data,
    error
  } =
    await db
      .from("partner_profiles")
      .select("*")
      .eq(
        "auth_user_id",
        user.id
      )
      .eq(
        "status",
        "ACTIVE"
      )
      .single();


  if(error){

    document.getElementById(
      "error"
    ).textContent =
      "Partner profile load failed: " +
      error.message;

    return;

  }


  partnerProfile = data;

}


document.getElementById(
  "orderForm"
).addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const errorBox =
      document.getElementById("error");

    errorBox.textContent = "";


    if(!partnerProfile){

      errorBox.textContent =
        "Partner profile not found.";

      return;

    }


    const governmentFee =
      Number(
        document.getElementById(
          "governmentFee"
        ).value
      ) || 0;


    const processingFee =
      Number(
        document.getElementById(
          "processingFee"
        ).value
      ) || 0;


    const {
      data,
      error
    } =
      await db
        .from("orders")
        .insert({

          partner_profile_id:
            partnerProfile.id,

          customer_name:
            document.getElementById(
              "customerName"
            ).value.trim(),

          customer_mobile:
            document.getElementById(
              "customerMobile"
            ).value.trim(),

          customer_address:
            document.getElementById(
              "customerAddress"
            ).value.trim(),

          service_category:
            document.getElementById(
              "serviceCategory"
            ).value,

          service_name:
            document.getElementById(
              "serviceName"
            ).value,

          document_notes:
            document.getElementById(
              "documentNotes"
            ).value.trim(),

          government_fee:
            governmentFee,

          processing_fee:
            processingFee,

          payment_status:
            document.getElementById(
              "paymentStatus"
            ).value,

          notes:
            document.getElementById(
              "notes"
            ).value.trim()

        })
        .select("order_id")
        .single();


    if(error){

      errorBox.textContent =
        "Order submission failed: " +
        error.message;

      return;

    }


    document.getElementById(
      "generatedOrderId"
    ).textContent =
      data.order_id;


    document.getElementById(
      "success"
    ).style.display =
      "block";


    document.getElementById(
      "orderForm"
    ).style.display =
      "none";

  }
);


loadPartner();

</script>

</body>
</html>
