<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operator Login | PartnerDesk Solutions</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f6f9;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:35px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:24px;
  font-weight:800;
  color:#0b1f3a;
  margin-bottom:8px;
}

.logo span{
  color:#10a6a6;
}

.subtitle{
  text-align:center;
  color:#687386;
  margin-bottom:28px;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d8dde6;
  border-radius:8px;
  font-size:15px;
}

.login-btn{
  width:100%;
  margin-top:22px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#0b1f3a;
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.login-btn:hover{
  opacity:.92;
}

.error{
  color:#b42318;
  background:#fff1f0;
  padding:10px;
  border-radius:7px;
  margin-top:15px;
  display:none;
}

.info{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#687386;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    Partner<span>Desk</span> Solutions
  </div>

  <div class="subtitle">
    Operator Login
  </div>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Operator email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    class="login-btn"
    onclick="login()"
  >
    LOGIN
  </button>

  <div
    id="error"
    class="error"
  ></div>

  <div class="info">
    Authorized PartnerDesk operators only
  </div>

</div>


<script>

const SUPABASE_URL =
"https://mraofbhjvvuqncexzpfn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_8U_YBekhylWgzRMbfiPd-A_niuXsWaP";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function login(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;


  const errorBox =
    document.getElementById(
      "error"
    );


  errorBox.style.display =
    "none";


  if(!email || !password){

    errorBox.textContent =
      "Email and password are required.";

    errorBox.style.display =
      "block";

    return;
  }


  const {
    data,
    error
  } =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    errorBox.textContent =
      error.message;

    errorBox.style.display =
      "block";

    return;
  }


  /*
    Verify that the logged-in
    user is actually an operator.
  */

  const {
    data: operator,
    error: operatorError
  } =
    await db
      .from("operators")
      .select(
        "id,operator_id,full_name,status"
      )
      .eq(
        "auth_user_id",
        data.user.id
      )
      .maybeSingle();


  if(
    operatorError ||
    !operator
  ){

    await db.auth.signOut();

    errorBox.textContent =
      "This account is not registered as an operator.";

    errorBox.style.display =
      "block";

    return;
  }


  if(
    operator.status !==
    "ACTIVE"
  ){

    await db.auth.signOut();

    errorBox.textContent =
      "Your operator account is not active.";

    errorBox.style.display =
      "block";

    return;
  }


  /*
    Login successful
  */

  window.location.href =
    "operator-dashboard.html";

}

</script>

</body>
</html>
